# Optimization laboratory configuration for multi-scale entropy maps (Task 09).
# All parameters, thresholds, sweeps, native compiler flags, and paths live here.
# Relative paths are resolved dynamically against the repository 'code/' root.

[entropy_optimization]
entropy_config = "configs/entropy/mvtec_ad.toml"
base_config = "configs/base.toml"
cnn_config = "configs/cnn/mvtec_ad.toml"
classification_config = "configs/classification/mvtec_ad.toml"
seed = 42
variants = [
    "V0_baseline",
    "V1_numpy_finest_pyramid",
    "V2_numpy_fused_entropy",
    "V3_c_single_pass",
]
reference_variant = "V0_baseline"
cnn_reference_models = ["ds_cnn", "ultra_tiny"]

[entropy_optimization.data]
source = "real"                # "real" (preprocessed images) | "synthetic"
n_real_samples = 200
image_size = 128

[entropy_optimization.native]
source_dir = "understanding/13_entropy_maps_optimization/native"
build_dir = "understanding/13_entropy_maps_optimization/native/build"
library_name = "entropy_pyramid"
c_sources = ["entropy_pyramid.c"]
compiler_flags = ["/O2", "/LD", "/arch:AVX2", "/fp:precise"]
vswhere_hint = "%ProgramFiles(x86)%/Microsoft Visual Studio/Installer/vswhere.exe"

[entropy_optimization.protocol]
threads = 1
batch_sizes = [1, 8, 32, 256]
warmup_iters = 20
timed_iters = 200
batch_timed_iters = 50
repeats = 3
disable_gc = true
tolerance_abs = 1e-12
bootstrap_resamples = 1000
confidence_level = 0.95
mann_whitney_alpha = 0.05

[entropy_optimization.sweeps]
bins_list = [8, 16, 32, 64]
image_sizes = [128, 256, 512]

[entropy_optimization.plots]
output_dir = "understanding/13_entropy_maps_optimization/outputs"
dpi = 200
formats = ["png"]
